<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tripgon Intro Renderer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@500;700;800&display=swap">
<style>
  body { margin: 0; font-family: Inter, sans-serif; background: #ddd; color: #111; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; }
  #stage { display: flex; justify-content: center; width: 100%; }
  canvas { max-width: 100%; box-shadow: 0 0 0 1px rgba(0,0,0,.2); background: #000; }
  .bar { display: flex; gap: 8px; align-items: center; width: min(900px, 100%); }
  #scrub { flex: 1; }
  button, select { font: inherit; padding: 4px 10px; }
  #info { font: 12px monospace; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <select id="fmt"><option value="vertical">9:16 vertical</option><option value="wide">16:9 wide</option></select>
  <button id="play">Play</button>
  <button id="sound">Sound</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <button id="export">Export</button>
</div>
<div id="info"></div>
<script src="vendor/mp4-muxer.js"></script>
<script src="vendor/webm-muxer.js"></script>
<script src="world.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="audio.js"></script>
<script src="main.js"></script>
</body>
</html>
