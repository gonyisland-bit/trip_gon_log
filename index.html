<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />

    <meta name="description" content="Tripgon log - 나만의 감성으로 기록하고 보관하는 프리미엄 여행 아카이브 및 타임라인 매거진" />
    <meta name="pinterest" content="nopin" description="Pinning from this website is not allowed." />
    <meta name="pinterest" content="nohover" />
    <title>Tripgon log — Your Personal Travel Magazine</title>
    
    <!-- Instant Theme & Background to eliminate white flash on browser reconnect -->
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('isDarkMode') === 'true';
          if (isDark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
    <style>
      :root {
        background-color: #FAF9F6;
        color: #000000;
      }
      html.dark {
        background-color: #141414;
        color: #ffffff;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #FAF9F6;
      }
      html.dark body {
        background-color: #141414;
      }
    </style>
    
    <!-- Fonts: Inter, Satoshi & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

    <!-- Preconnect for external CDNs -->
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Leaflet CSS & JS (Deferred) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <!-- Google Maps JS SDK (Places Library, Deferred) -->
    <script defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD3v6WKVr8wXirD5npL-DVDJMWrZUFm7xY&libraries=places"></script>

    <!-- EXIF-JS for parsing image metadata (Deferred) -->
    <script defer src="https://cdn.jsdelivr.net/npm/exif-js"></script>
  </head>
  <body>
    <div id="root">
      <!-- Critical Inline App Skeleton: Renders in 10ms before JS bundles load -->
      <div id="app-skeleton" style="min-height: 100vh; display: flex; flex-direction: column; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <!-- Header Skeleton -->
        <div style="height: 56px; border-bottom: 1px solid rgba(120,120,120,0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 18px; height: 18px; background: #dc2626; border-radius: 2px;"></div>
            <span style="font-weight: 900; font-size: 14px; letter-spacing: 0.1em; color: inherit;">TRIPGON LOG</span>
          </div>
          <div style="display: flex; gap: 16px; opacity: 0.4;">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em;">JOURNAL</span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em;">ARCHIVE</span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em;">MAGAZINE</span>
            <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.05em;">MAP</span>
          </div>
        </div>
        <!-- Hero Body Minimal Indicator -->
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px;">
          <div style="width: 26px; height: 26px; border: 2px solid rgba(150,150,150,0.25); border-top-color: currentColor; border-radius: 50%; animation: initialSpin 0.8s linear infinite;"></div>
        </div>
      </div>
      <style>
        @keyframes initialSpin { to { transform: rotate(360deg); } }
        html.dark #app-skeleton div { border-color: rgba(255,255,255,0.12) !important; }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
